name: Q7 access-policy regression
on:
  push:
    branches:
      - 'feature/q7-*'
    paths:
      - 'src/lib/courses/access-policy.ts'
      - 'tests/q7-access-policy.test.mjs'
      - '.github/workflows/q7-access-policy.yml'
  pull_request:
    paths:
      - 'src/lib/courses/access-policy.ts'
      - 'tests/q7-access-policy.test.mjs'
      - '.github/workflows/q7-access-policy.yml'
permissions:
  contents: read
jobs:
  entitlement:
    name: Free previews, expiry, revocation and roles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run pure policy regression tests (no secrets)
        run: node --experimental-strip-types --test tests/q7-access-policy.test.mjs
